include:
  # Namespace là 'root' vì GitLab self-hosted này chạy dưới tài khoản admin
  # mặc định, không phải tên người dùng GitHub. Sai namespace thì pipeline hỏng
  # ngay ở bước include, trước khi bất kỳ job nào chạy.
  - project: 'root/ci-templates'
    ref: main
    file: '/security.gitlab-ci.yml'

stages:
  - scan
  - report

variables:
  SECURITY_FAIL_ON: ''

# LaTeX sources and PDFs. Dependency, IaC and SAST scanning have nothing to
# look at; secret detection still does, because a report is exactly the kind of
# document someone pastes a token into.
deps:trivy:
  rules: [{ when: never }]

deps:dotnet:
  rules: [{ when: never }]

iac:trivy:
  rules: [{ when: never }]

sast:semgrep:
  rules: [{ when: never }]
